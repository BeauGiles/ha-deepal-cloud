set_charge_window:
  name: Set charge window
  description: >-
    Set the charging schedule's start and end times in one command, keeping
    the current start and end switches as they are. Target the Charge
    Schedule switch.
  target:
    entity:
      domain: switch
      integration: deepal
  fields:
    start_time:
      name: Start time
      description: Time of day the charge window starts.
      required: true
      example: "00:30:00"
      selector:
        time:
    end_time:
      name: End time
      description: Time of day the charge window ends.
      required: true
      example: "07:00:00"
      selector:
        time:
